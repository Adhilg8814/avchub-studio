name: Bug report
description: Something behaves differently from what the docs or the code says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report a security vulnerability here — see SECURITY.md for the private channel.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. A failing test is ideal.
      placeholder: |
        1. npm run demo:seed
        2. ...
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error message, stack trace, or the command output. Redact anything private.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit sha.
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations: { required: true }
