name: Feature request
description: Something the project should be able to do and cannot
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to accomplish? Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already know the shape of the fix, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using today, and why they are not enough.
